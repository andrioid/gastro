name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run test
      # `mise run test` only walks the root module. Sub-modules
      # (examples/*, pkg/chromalexer/* and datastar/) each have their
      # own go.mod; verify discovers and tests them.
      - run: mise run verify
      # Smoke check: `go generate ./...` for the example must succeed
      # against the freshly-cloned tree (no committed static/styles.css,
      # no .gastro/). Catches missing-tool / broken-directive issues at
      # CI time rather than at first dev or deploy. No drift check
      # because every generated artifact this command produces is
      # gitignored.
      - name: Verify examples/gastro generators run clean
        working-directory: examples/gastro
        run: go generate ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run lint

  # Non-blocking smoke test: build and verify git-pm (the main downstream
  # consumer) against this gastro checkout, at the git-pm commit pinned in
  # .github/downstream.txt. A red run here flags a downstream break without
  # failing the PR.
  downstream-git-pm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: gastro
      - name: Read pinned git-pm commit
        id: pin
        run: echo "sha=$(grep -v -e '^#' -e '^[[:space:]]*$' gastro/.github/downstream.txt | head -n 1)" >> "$GITHUB_OUTPUT"
      # Full history so a short SHA from downstream.txt resolves.
      - uses: actions/checkout@v4
        with:
          repository: andrioid/git-pm
          path: git-pm
          fetch-depth: 0
      - name: Check out pinned git-pm commit
        run: git -C git-pm checkout --detach "${{ steps.pin.outputs.sha }}"
      - uses: jdx/mise-action@v4
        with:
          working_directory: git-pm
      # A git-pm commit with `replace github.com/andrioid/gastro => ../gastro`
      # already resolves to the sibling checkout. Otherwise join the modules
      # in a go.work so git-pm builds against this gastro.
      - name: Point git-pm at this gastro checkout
        working-directory: git-pm
        run: |
          if grep -Eq '^replace[[:space:]]+github.com/andrioid/gastro[[:space:]]+=>[[:space:]]+\.\./gastro' go.mod; then
            echo "go.mod already replaces gastro with ../gastro"
          else
            go work init . ../gastro
            if [ -f ../gastro/datastar/go.mod ]; then
              go work use ../gastro/datastar
            fi
            cat go.work
          fi
      - name: git-pm verify
        working-directory: git-pm
        run: mise run verify

  check-zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - run: cargo check --target wasm32-wasip1
        working-directory: editors/zed
